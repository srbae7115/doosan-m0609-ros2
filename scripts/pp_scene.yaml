# MoveIt 장면 + Pick & Place 검증 설정 (단위 mm, 로봇 베이스 좌표계)
#
# [책상: 실습실 공통 고정값] 모든 실습 책상이 같으므로 학생은 책상을 측정하지 않습니다.
#   2026-11-13 직접 교시 측정(4점, scripts/table_points.py) + 책상 접촉 1점으로 보정한 값입니다.
#   책상이 바뀐 경우에만 table_points.py 로 다시 재고 아래 desk / table 값을 고칩니다.
desk:
  # 실제 책상 윗면 (손가락 끝 기준) z = a·x + b·y + c [mm]. 로봇 베이스가 약 1.5° 기울어 먼 쪽이 높음
  plane: [0.024567, 0.009402, -9.759]
# 충돌 모델용 평평한 박스: 윗면 = 위 평면의 작업 범위(X 267~754, Y -225~221) 내 최대 높이 10.8 → 11 mm
#   (가까운 쪽에서는 실제보다 최대 ~16 mm 높게 잡힘 = 안전한 쪽)
table:
  top_z: 11.0
  x: [180.0, 950.0]      # 로봇 베이스(반경 ~80 mm) 주변은 비움
  y: [-450.0, 450.0]
  thickness: 40.0

# 그리퍼 (link_6 = 플랜지에 부착). SCHUNK EGP-C 40 M1013: 본체 93.8 x 90.2 x 123.0 mm, 손가락 끝 140 mm (실측)
gripper:
  body: [94.0, 91.0, 123.0]     # x, y, z(플랜지 → 본체 윗면)
  finger_zone: [40.0, 40.0, 17.0]  # 본체 윗면 → 손가락 끝 (손가락 형상 모름 → 40x40 영역으로 근사)
  tool_length: 140.0

# 잡을 직육면체 (크기 미정 → 정해지면 입력). grasp: 손가락 끝이 물체 밑면에서 몇 mm 위를 잡는지는
# pick 티칭 높이와 테이블 높이로 자동 계산
workpiece:
  footprint: [20.0, 20.0]   # 직육면체 가로 x 세로 (책상 위에 세워 둠, 구멍 꽂기 안 함)
  heights: [60.0, 50.0, 40.0]  # 3종. pick 티칭 높이로 잡을 수 있는 것만 검사

# 테이블 위 고정 물체 (측정 후 입력). 예:
#   - {name: fixture1, center: [500.0, 300.0], size: [100.0, 80.0, 60.0]}   # center x,y / 크기 x,y,높이(테이블 윗면부터)
fixed_objects: []

# Pick & Place 접근 높이 (툴 Z 방향, GUI 기본값과 같게)
approach: 100.0
# 우회 경로: pick/place 사이를 바로 가지 않고 이 플랜지 높이까지 수직 상승 → 수평 이동 → 수직 하강
transit_z: 350.0
points_file: ~/m0609_points_XJD0F0-M0609.json
